name: test
on:
  - push
  - pull_request
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.x
        # The package supports both major versions of the framework, so both
        # are exercised rather than promised
        adonis-version:
          - 6
          - 7
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Use AdonisJS ${{ matrix.adonis-version }}
        run: pnpm add -D @adonisjs/core@${{ matrix.adonis-version }}
      - name: Run tests
        run: pnpm test
